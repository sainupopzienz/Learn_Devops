name: DevOps Wiki CI/CD + Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build Docker Image
        continue-on-error: true
        run: |
          docker build -t devops-wiki . 2>&1 | tee docker.log

      # -------------------------
      # Trivy Security Scan
      # -------------------------
      - name: Run Trivy Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-wiki
          severity: CRITICAL,HIGH

      # -------------------------
      # Generate Failure Report
      # -------------------------
      - name: Generate final.md
        if: failure()
        run: |
          echo "# ❌ CI Failure Report" > final.md
          echo "" >> final.md

          echo "## 🐳 Docker Logs" >> final.md
          echo '```text' >> final.md
          tail -n 200 docker.log >> final.md
          echo '```' >> final.md

          echo "" >> final.md
          echo "## 🔐 Security Scan (Trivy)" >> final.md
          echo "Check workflow logs for CVEs (HIGH/CRITICAL)" >> final.md

          echo "" >> final.md
          echo "## 📌 Context" >> final.md
          echo "- Project: DevOps Wiki" >> final.md
          echo "- Type: Static Docker Nginx Site" >> final.md

          echo "" >> final.md
          echo "## 🤖 Next Step" >> final.md
          echo "Paste this file into Claude and ask for fix + corrected Dockerfile/YAML" >> final.md

      # -------------------------
      # UPLOAD ARTIFACT (IMPORTANT)
      # -------------------------
      - name: Upload Failure Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report
          path: final.md

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
