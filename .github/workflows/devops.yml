name: DevOps Wiki CI/CD + Security Scan

on:
  #pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build Docker Image
        id: build
        #continue-on-error: true
        run: |
          docker build -t devops-wiki . 2>&1 | tee docker.log
          echo "docker_status=$?" >> $GITHUB_OUTPUT

      # -------------------------
      # Trivy Security Scan (IMPORTANT FIX)
      # -------------------------
      - name: Run Trivy Security Scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-wiki
          severity: CRITICAL,HIGH
          exit-code: 1

      # -------------------------
      # Generate Failure Report (ALWAYS RUN IF FAILURE)
      # -------------------------
      - name: Generate final.md report
        if: failure()
        run: |
          echo "# ❌ CI/CD Failure Report" > final.md
          echo "" >> final.md

          echo "## 🐳 Docker Build Logs" >> final.md
          echo '```text' >> final.md
          tail -n 200 docker.log >> final.md
          echo '```' >> final.md

          echo "" >> final.md
          echo "## 🔐 Trivy Security Scan" >> final.md
          echo "HIGH/CRITICAL vulnerabilities detected (check workflow logs)" >> final.md

          echo "" >> final.md
          echo "## 📌 Context" >> final.md
          echo "- Project: DevOps Wiki" >> final.md
          echo "- Stack: Nginx + Static HTML + Markdown" >> final.md

          echo "" >> final.md
          echo "## 🤖 AI Fix Instruction" >> final.md
          echo "Paste this into Claude and ask:" >> final.md
          echo "> Analyze CI failure and provide fix + corrected Dockerfile + GitHub Actions update" >> final.md

      # -------------------------
      # UPLOAD ARTIFACT (IMPORTANT)
      # -------------------------
      - name: Upload Failure Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report
          path: final.md

  # -------------------------
  # DEPLOY ONLY IF CI PASSES
  # -------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Deploying to production..."
          curl "$deploy_url"
          echo "✅ Deployment successful"
