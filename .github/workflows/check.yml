name: DevOps Wiki CI/CD + Security Scan

on:
  pull_request:
  
jobs:
  ci:
    runs-on: ubuntu-latest
  

      # -------------------------
      # Trivy Security Scan (IMPORTANT FIX)
      # -------------------------
      - name: Run Trivy Security Scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-wiki
          severity: CRITICAL,HIGH
          exit-code: 1

    
